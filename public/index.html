<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASO数据分析平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .status {
            display: inline-block;
            padding: 8px 16px;
            background: #10b981;
            color: white;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 30px;
            padding: 25px;
            background: #f9fafb;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #333;
        }
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: transform 0.2s;
            font-size: 14px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 10px;
        }
        .keyword-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 2px solid #e5e7eb;
            transition: all 0.2s;
        }
        .keyword-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }
        .keyword-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .keyword-name {
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }
        .keyword-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            font-size: 14px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-label {
            color: #999;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .stat-value {
            color: #333;
            font-weight: bold;
            font-size: 16px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .api-status {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 15px;
            background: #f0f9ff;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 ASO数据分析平台</h1>
        <p class="subtitle">全球应用市场数据追踪与关键词分析系统</p>
        <span class="status" id="apiStatus">⏳ 正在连接API...</span>

        <div class="api-status">
            <div>
                <strong>API地址：</strong>
                <span id="apiUrl" style="color: #667eea; font-family: monospace;">检测中...</span>
            </div>
        </div>

        <div class="section">
            <h2>📋 热门关键词数据库</h2>
            <p style="color: #666; margin-bottom: 15px;">包含多个分类的关键词，支持实时搜索量和竞争度分析</p>
            <button class="btn" onclick="loadAllKeywords()">🔄 加载所有关键词</button>
            <button class="btn" onclick="loadCategory('productivity')">💼 生产力工具</button>
            <button class="btn" onclick="loadCategory('social')">💬 社交媒体</button>
            <button class="btn" onclick="loadCategory('games')">🎮 游戏</button>
            <button class="btn" onclick="loadCategory('health')">💪 健康健身</button>
        </div>

        <div class="section">
            <h2>🔍 应用搜索</h2>
            <input type="text" id="searchInput" placeholder="输入应用名称（如：Instagram、WhatsApp、TikTok）">
            <button class="btn" onclick="searchApp()" style="margin-top: 10px;">搜索应用</button>
        </div>

        <div id="keywordList"></div>
    </div>

    <script>
        // API基础URL（自动检测）
        const API_BASE = window.location.origin;
        
        // 检测API状态
        async function checkAPIStatus() {
            const statusEl = document.getElementById('apiStatus');
            const urlEl = document.getElementById('apiUrl');
            
            try {
                const response = await fetch(`${API_BASE}/api/keywords?limit=1`);
                if (response.ok) {
                    statusEl.innerHTML = '✓ API已连接';
                    statusEl.style.background = '#10b981';
                    urlEl.textContent = API_BASE;
                } else {
                    throw new Error('API返回错误');
                }
            } catch (error) {
                statusEl.innerHTML = '⚠️ API未响应';
                statusEl.style.background = '#f59e0b';
                urlEl.textContent = API_BASE + ' (使用本地数据)';
                // 使用本地备份数据
                useLocalData();
            }
        }

        // 加载所有关键词
        async function loadAllKeywords() {
            showLoading('正在加载所有关键词...');
            
            try {
                const response = await fetch(`${API_BASE}/api/keywords?limit=100`);
                const data = await response.json();
                
                if (data.success) {
                    displayKeywords(data.keywords, '所有关键词');
                } else {
                    throw new Error('数据加载失败');
                }
            } catch (error) {
                showError('无法加载数据：' + error.message);
                // 使用备份数据
                displayKeywords(getLocalKeywords(), '所有关键词（本地数据）');
            }
        }

        // 按分类加载
        async function loadCategory(category) {
            showLoading(`正在加载${getCategoryName(category)}关键词...`);
            
            try {
                const response = await fetch(`${API_BASE}/api/keywords?category=${category}`);
                const data = await response.json();
                
                if (data.success) {
                    displayKeywords(data.keywords, getCategoryName(category));
                } else {
                    throw new Error('数据加载失败');
                }
            } catch (error) {
                const local = getLocalKeywords().filter(k => k.category === category);
                displayKeywords(local, getCategoryName(category) + '（本地数据）');
            }
        }

        // 搜索应用
        async function searchApp() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('请输入应用名称');
                return;
            }
            
            showLoading(`正在搜索"${query}"...`);
            
            try {
                const response = await fetch(`${API_BASE}/api/search?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (data.success) {
                    displaySearchResults(data);
                } else {
                    throw new Error('搜索失败');
                }
            } catch (error) {
                showError('搜索失败：' + error.message);
            }
        }

        // 显示关键词列表
        function displayKeywords(keywords, title) {
            const listDiv = document.getElementById('keywordList');
            
            let html = `
                <div class="section">
                    <h2>${title}（共 ${keywords.length} 个）</h2>
            `;
            
            keywords.forEach(k => {
                const trendIcon = k.trend === 'up' ? '📈' : k.trend === 'down' ? '📉' : '➡️';
                html += `
                    <div class="keyword-item">
                        <div class="keyword-header">
                            <div class="keyword-name">${k.keyword}</div>
                            <span class="badge badge-${k.difficulty > 70 ? 'warning' : 'success'}">
                                ${k.category}
                            </span>
                        </div>
                        <div class="keyword-stats">
                            <div class="stat-item">
                                <div class="stat-label">搜索量</div>
                                <div class="stat-value">${k.volume.toLocaleString()}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">竞争度</div>
                                <div class="stat-value">${k.difficulty}/100</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">趋势</div>
                                <div class="stat-value">${trendIcon}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">应用数</div>
                                <div class="stat-value">${k.apps}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            listDiv.innerHTML = html;
        }

        // 显示搜索结果
        function displaySearchResults(data) {
            const listDiv = document.getElementById('keywordList');
            
            let html = `
                <div class="section">
                    <h2>搜索结果："${data.query}"</h2>
            `;
            
            data.results.forEach(app => {
                html += `
                    <div class="keyword-item">
                        <div class="keyword-header">
                            <div class="keyword-name">${app.name}</div>
                            <span class="badge badge-success">排名 #${app.rank}</span>
                        </div>
                        <div class="keyword-stats">
                            <div class="stat-item">
                                <div class="stat-label">开发者</div>
                                <div class="stat-value" style="font-size: 14px;">${app.developer}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">评分</div>
                                <div class="stat-value">⭐ ${app.rating}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">分类</div>
                                <div class="stat-value" style="font-size: 14px;">${app.category}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">商店</div>
                                <div class="stat-value" style="font-size: 14px;">${app.store}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            listDiv.innerHTML = html;
        }

        // 辅助函数
        function showLoading(message) {
            document.getElementById('keywordList').innerHTML = 
                `<div class="loading">${message}</div>`;
        }

        function showError(message) {
            document.getElementById('keywordList').innerHTML = 
                `<div class="error">${message}</div>`;
        }

        function getCategoryName(category) {
            const names = {
                'productivity': '生产力工具',
                'social': '社交媒体',
                'games': '游戏',
                'health': '健康健身'
            };
            return names[category] || category;
        }

        // 本地备份数据
        function getLocalKeywords() {
            return [
                { keyword: 'productivity', volume: 125000, difficulty: 65, category: 'productivity', trend: 'up', apps: 1250 },
                { keyword: 'task manager', volume: 85000, difficulty: 52, category: 'productivity', trend: 'stable', apps: 850 },
                { keyword: 'to do list', volume: 95000, difficulty: 58, category: 'productivity', trend: 'up', apps: 920 },
                { keyword: 'social media', volume: 245000, difficulty: 85, category: 'social', trend: 'up', apps: 2450 },
                { keyword: 'messenger', volume: 198000, difficulty: 78, category: 'social', trend: 'stable', apps: 1980 },
                { keyword: 'puzzle game', volume: 215000, difficulty: 88, category: 'games', trend: 'up', apps: 3200 },
                { keyword: 'fitness tracker', volume: 135000, difficulty: 75, category: 'health', trend: 'up', apps: 1350 }
            ];
        }

        function useLocalData() {
            console.log('使用本地备份数据');
        }

        // 页面加载时执行
        window.onload = function() {
            checkAPIStatus();
            setTimeout(() => loadAllKeywords(), 500);
        };
    </script>
</body>
</html>
