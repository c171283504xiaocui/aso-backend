<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASO数据分析平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .search-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .input-group {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        input, select {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none;
        }
        
        .app-info {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .app-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        .stats {
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }
        
        .stat {
            font-size: 14px;
            color: #6b7280;
        }
        
        .stat strong {
            color: #1f2937;
            font-size: 18px;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: #f3f4f6;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
        }
        
        .keyword-list {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .keyword-item {
            display: grid;
            grid-template-columns: 2fr 80px 120px 120px 80px 100px;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid #f3f4f6;
            align-items: center;
        }
        
        .keyword-item:hover {
            background: #f9fafb;
        }
        
        .keyword-header {
            display: grid;
            grid-template-columns: 2fr 80px 120px 120px 80px 100px;
            gap: 15px;
            padding: 15px;
            background: #f9fafb;
            font-weight: bold;
            font-size: 13px;
            color: #374151;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .rank-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
        }
        
        .rank-top10 { background: #d1fae5; color: #065f46; }
        .rank-top20 { background: #fef3c7; color: #92400e; }
        .rank-top50 { background: #e5e7eb; color: #374151; }
        
        .progress {
            width: 100%;
            height: 6px;
            background: #f3f4f6;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            border-radius: 3px;
        }
        
        .progress-high { background: #ef4444; }
        .progress-medium { background: #f59e0b; }
        .progress-low { background: #10b981; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f4f6;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .page-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        @media (max-width: 768px) {
            .input-group {
                grid-template-columns: 1fr;
            }
            .keyword-item, .keyword-header {
                grid-template-columns: 1fr;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="font-size: 28px; margin-bottom: 10px;">🚀 ASO数据分析平台</h1>
        <p style="opacity: 0.9;">专业的应用商店关键词优化工具</p>
    </div>

    <div class="search-box">
        <div class="input-group">
            <input type="text" id="appInput" placeholder="输入应用名称（如：Instagram, WhatsApp）">
            <select id="storeSelect">
                <option value="appstore">App Store</option>
                <option value="googleplay">Google Play</option>
            </select>
            <select id="countrySelect">
                <option value="us">🇺🇸 美国</option>
                <option value="cn">🇨🇳 中国</option>
                <option value="jp">🇯🇵 日本</option>
                <option value="kr">🇰🇷 韩国</option>
            </select>
            <button class="btn" id="searchBtn" onclick="searchApp()">搜索</button>
        </div>
    </div>

    <div id="loadingBox" class="result-box">
        <div class="loading">
            <div class="spinner"></div>
            <div>正在分析数据...</div>
        </div>
    </div>

    <div id="resultBox" class="result-box">
        <div class="app-info">
            <div class="app-icon">📱</div>
            <div>
                <h2 id="appName" style="font-size: 22px; margin-bottom: 5px;">应用名称</h2>
                <div id="appDev" style="color: #6b7280; margin-bottom: 10px;">开发者</div>
                <div class="stats">
                    <div class="stat">评分: <strong id="appRating">0</strong></div>
                    <div class="stat">排名: <strong id="appRank">#0</strong></div>
                    <div class="stat">关键词: <strong id="kwCount">0</strong></div>
                </div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterKw('all')">全部</button>
            <button class="filter-btn" onclick="filterKw('top10')">Top 10</button>
            <button class="filter-btn" onclick="filterKw('top20')">Top 20</button>
            <button class="filter-btn" onclick="filterKw('high')">高搜索量</button>
            <button class="filter-btn" onclick="filterKw('low')">低难度</button>
        </div>

        <div class="keyword-header">
            <div>关键词</div>
            <div>排名</div>
            <div>搜索量</div>
            <div>竞争度</div>
            <div>趋势</div>
            <div>预估流量</div>
        </div>

        <div id="keywordList" class="keyword-list"></div>

        <div id="pagination" class="pagination"></div>
    </div>

    <script>
        let allKeywords = [];
        let filteredKeywords = [];
        let currentPage = 1;
        const itemsPerPage = 20;
        let isLoading = false;

        async function searchApp() {
            if (isLoading) return;
            
            const query = document.getElementById('appInput').value.trim();
            if (!query) {
                alert('请输入应用名称');
                return;
            }

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            isLoading = true;

            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('loadingBox').style.display = 'block';

            try {
                const store = document.getElementById('storeSelect').value;
                const country = document.getElementById('countrySelect').value;
                
                const response = await fetch(
                    `${window.location.origin}/api/app-keywords?appId=${encodeURIComponent(query)}&store=${store}&country=${country}`,
                    { timeout: 15000 }
                );
                
                const data = await response.json();

                if (data.success) {
                    displayApp(data);
                } else {
                    alert('获取数据失败');
                }
            } catch (error) {
                alert('请求失败，请重试');
            } finally {
                btn.disabled = false;
                isLoading = false;
                document.getElementById('loadingBox').style.display = 'none';
            }
        }

        function displayApp(data) {
            document.getElementById('appName').textContent = data.app.name;
            document.getElementById('appDev').textContent = data.app.developer;
            document.getElementById('appRating').textContent = data.app.rating + ' ⭐';
            document.getElementById('appRank').textContent = '#' + data.app.rank;
            document.getElementById('kwCount').textContent = data.keywords.length;

            allKeywords = data.keywords;
            filteredKeywords = allKeywords;
            currentPage = 1;

            displayKeywords();
            document.getElementById('resultBox').style.display = 'block';
        }

        function displayKeywords() {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageKeywords = filteredKeywords.slice(start, end);

            const container = document.getElementById('keywordList');
            container.innerHTML = '';

            pageKeywords.forEach(kw => {
                const div = document.createElement('div');
                div.className = 'keyword-item';

                let rankClass = 'rank-top50';
                if (kw.rank <= 10) rankClass = 'rank-top10';
                else if (kw.rank <= 20) rankClass = 'rank-top20';

                let diffClass = 'progress-low';
                if (kw.difficulty > 70) diffClass = 'progress-high';
                else if (kw.difficulty > 50) diffClass = 'progress-medium';

                const trendIcon = kw.trend > 0 ? '↑' : kw.trend < 0 ? '↓' : '→';
                const trendColor = kw.trend > 0 ? '#10b981' : kw.trend < 0 ? '#ef4444' : '#6b7280';

                div.innerHTML = `
                    <div style="font-weight: 600;">${kw.keyword}</div>
                    <div><span class="rank-badge ${rankClass}">#${kw.rank}</span></div>
                    <div>${kw.volume.toLocaleString()}</div>
                    <div>
                        <div class="progress">
                            <div class="progress-bar ${diffClass}" style="width: ${kw.difficulty}%"></div>
                        </div>
                        <div style="font-size: 11px; color: #9ca3af; margin-top: 2px;">${kw.difficulty}/100</div>
                    </div>
                    <div style="color: ${trendColor}; font-weight: bold;">${trendIcon} ${Math.abs(kw.trend)}</div>
                    <div style="font-weight: 600; color: #667eea;">${kw.traffic.toLocaleString()}</div>
                `;

                container.appendChild(div);
            });

            updatePagination();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredKeywords.length / itemsPerPage);
            const container = document.getElementById('pagination');
            container.innerHTML = '';

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
                btn.textContent = i;
                btn.onclick = () => {
                    currentPage = i;
                    displayKeywords();
                    window.scrollTo(0, 0);
                };
                container.appendChild(btn);
            }
        }

        function filterKw(type) {
            // 更新按钮状态
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 筛选数据
            switch(type) {
                case 'all':
                    filteredKeywords = allKeywords;
                    break;
                case 'top10':
                    filteredKeywords = allKeywords.filter(k => k.rank <= 10);
                    break;
                case 'top20':
                    filteredKeywords = allKeywords.filter(k => k.rank <= 20);
                    break;
                case 'high':
                    filteredKeywords = allKeywords.filter(k => k.volume >= 80000);
                    break;
                case 'low':
                    filteredKeywords = allKeywords.filter(k => k.difficulty < 50);
                    break;
            }

            currentPage = 1;
            displayKeywords();
        }

        // 回车搜索
        document.getElementById('appInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchApp();
            }
        });
    </script>
</body>
</html>
