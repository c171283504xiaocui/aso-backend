<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASO数据分析平台 - 调试版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .search-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .input-group {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 10px;
            margin-bottom: 15px;
        }
        input, select, button {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .debug-box {
            background: #f0f9ff;
            border: 2px solid #bae6fd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-item {
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 4px;
            background: white;
        }
        .log-success { border-left: 4px solid #10b981; }
        .log-error { border-left: 4px solid #ef4444; background: #fee; }
        .log-info { border-left: 4px solid #3b82f6; }
        .result-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none;
        }
        .app-info {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .app-icon {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            object-fit: cover;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f4f6;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            background: #f9fafb;
            font-weight: 600;
        }
        .rank-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
        }
        .rank-top10 { background: #d1fae5; color: #065f46; }
        .rank-top20 { background: #fef3c7; color: #92400e; }
        .rank-other { background: #e5e7eb; color: #374151; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 ASO数据分析平台 - 调试版</h1>
            <p>实时显示所有请求和错误信息</p>
        </div>

        <div class="search-box">
            <div class="input-group">
                <input type="text" id="appInput" placeholder="输入应用名称或App ID（如：微信、414478124）">
                <select id="countrySelect">
                    <option value="cn">🇨🇳 中国</option>
                    <option value="us">🇺🇸 美国</option>
                    <option value="jp">🇯🇵 日本</option>
                </select>
                <button id="searchBtn" onclick="searchApp()">搜索分析</button>
            </div>
        </div>

        <div class="debug-box" id="debugBox">
            <strong>调试日志：</strong>
            <div id="debugLogs"></div>
        </div>

        <div id="loadingBox" class="result-box">
            <div class="loading">
                <div class="spinner"></div>
                <div>正在加载数据...</div>
            </div>
        </div>

        <div id="resultBox" class="result-box">
            <div class="app-info">
                <img id="appIcon" class="app-icon" src="" alt="App Icon">
                <div>
                    <h2 id="appName">应用名称</h2>
                    <div id="appDev" style="color: #6b7280;">开发者</div>
                    <div style="margin-top: 10px;">
                        ⭐ <strong id="appRating">0</strong> |
                        📁 <strong id="appCategory">分类</strong> |
                        🔑 <strong id="kwCount">0</strong> 个关键词
                    </div>
                </div>
            </div>

            <h3 style="margin: 20px 0 15px 0;">关键词列表</h3>
            <table>
                <thead>
                    <tr>
                        <th>关键词</th>
                        <th>排名</th>
                        <th>搜索指数</th>
                        <th>难度</th>
                        <th>流量/日</th>
                    </tr>
                </thead>
                <tbody id="keywordsTable">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let isLoading = false;

        function log(message, type = 'info', data = null) {
            const logsDiv = document.getElementById('debugLogs');
            const logItem = document.createElement('div');
            logItem.className = `log-item log-${type}`;
            
            const time = new Date().toLocaleTimeString();
            let content = `[${time}] ${message}`;
            
            if (data) {
                content += '\n' + JSON.stringify(data, null, 2).substring(0, 500);
            }
            
            logItem.textContent = content;
            logsDiv.appendChild(logItem);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            
            console.log(message, data);
        }

        async function searchApp() {
            if (isLoading) {
                log('⚠️ 请求正在进行中，请等待...', 'info');
                return;
            }

            const appId = document.getElementById('appInput').value.trim();
            const country = document.getElementById('countrySelect').value;

            if (!appId) {
                log('❌ 请输入应用名称或ID', 'error');
                alert('请输入应用名称或App ID');
                return;
            }

            isLoading = true;
            document.getElementById('searchBtn').disabled = true;
            document.getElementById('debugLogs').innerHTML = '';
            
            log('🚀 开始搜索...', 'info', { appId, country, apiBase: API_BASE });

            // 显示加载状态
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('loadingBox').style.display = 'block';

            try {
                // 构建API URL
                const detailUrl = `${API_BASE}/api/app-detail?appId=${encodeURIComponent(appId)}&country=${country}`;
                const keywordsUrl = `${API_BASE}/api/app-keywords?appId=${encodeURIComponent(appId)}&country=${country}&limit=100`;
                
                log('📍 API URL:', 'info', { detailUrl, keywordsUrl });

                // 请求应用详情
                log('🌐 请求应用详情...', 'info');
                const detailRes = await fetch(detailUrl);
                log('✅ 详情响应:', 'success', { 
                    status: detailRes.status, 
                    ok: detailRes.ok,
                    statusText: detailRes.statusText 
                });

                if (!detailRes.ok) {
                    const errorText = await detailRes.text();
                    log('❌ 详情请求失败', 'error', { status: detailRes.status, error: errorText });
                    throw new Error(`应用详情请求失败: ${detailRes.status}`);
                }

                const detailData = await detailRes.json();
                log('📦 详情数据:', 'success', detailData);

                if (!detailData.success) {
                    throw new Error(detailData.error || '应用不存在');
                }

                // 请求关键词数据
                log('🌐 请求关键词数据...', 'info');
                const keywordsRes = await fetch(keywordsUrl);
                log('✅ 关键词响应:', 'success', { 
                    status: keywordsRes.status, 
                    ok: keywordsRes.ok 
                });

                if (!keywordsRes.ok) {
                    const errorText = await keywordsRes.text();
                    log('❌ 关键词请求失败', 'error', { status: keywordsRes.status, error: errorText });
                    throw new Error(`关键词请求失败: ${keywordsRes.status}`);
                }

                const keywordsData = await keywordsRes.json();
                log('📦 关键词数据:', 'success', { 
                    total: keywordsData.keywords?.length,
                    statistics: keywordsData.statistics 
                });

                if (!keywordsData.success) {
                    throw new Error(keywordsData.error || '关键词获取失败');
                }

                // 显示结果
                log('✨ 开始渲染界面...', 'success');
                displayResults(detailData.data, keywordsData);

            } catch (error) {
                log('❌ 错误:', 'error', { 
                    message: error.message, 
                    stack: error.stack 
                });
                alert('加载失败: ' + error.message);
                document.getElementById('loadingBox').style.display = 'none';
            } finally {
                isLoading = false;
                document.getElementById('searchBtn').disabled = false;
            }
        }

        function displayResults(detail, keywords) {
            log('🎨 渲染应用信息...', 'info');

            // 应用信息
            document.getElementById('appIcon').src = detail.icon;
            document.getElementById('appName').textContent = detail.appName;
            document.getElementById('appDev').textContent = detail.developer;
            document.getElementById('appRating').textContent = detail.rating.toFixed(1);
            document.getElementById('appCategory').textContent = detail.category;
            document.getElementById('kwCount').textContent = keywords.keywords.length;

            // 关键词表格
            const tbody = document.getElementById('keywordsTable');
            tbody.innerHTML = '';

            log(`📝 渲染 ${keywords.keywords.length} 个关键词`, 'info');

            keywords.keywords.slice(0, 50).forEach(kw => {
                const tr = document.createElement('tr');

                let rankClass = 'rank-other';
                if (kw.rank <= 10) rankClass = 'rank-top10';
                else if (kw.rank <= 20) rankClass = 'rank-top20';

                tr.innerHTML = `
                    <td><strong>${kw.keyword}</strong></td>
                    <td><span class="rank-badge ${rankClass}">#${kw.rank}</span></td>
                    <td>${kw.searchIndex.toLocaleString()}</td>
                    <td>${kw.difficulty}</td>
                    <td style="font-weight: 600; color: #3b82f6;">${kw.traffic.toLocaleString()}</td>
                `;

                tbody.appendChild(tr);
            });

            // 显示结果
            document.getElementById('loadingBox').style.display = 'none';
            document.getElementById('resultBox').style.display = 'block';

            log('✅ 渲染完成！', 'success');
        }

        // 回车搜索
        document.getElementById('appInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchApp();
            }
        });

        // 页面加载时显示信息
        window.onload = function() {
            log('🚀 页面加载完成', 'success', {
                apiBase: API_BASE,
                location: window.location.href
            });
        };
    </script>
</body>
</html>
